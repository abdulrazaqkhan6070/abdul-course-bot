<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>University Course Advisor</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column; background: #fff; }
  header { padding: 14px 18px; border-bottom: 1px solid #e3e5e8; font-weight: 600; display: flex; justify-content: space-between; }
  #status { font-weight: 400; font-size: 13px; color: #888; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .bot { align-self: flex-start; background: #eef0f3; }
  .tool { align-self: flex-start; font-size: 12px; color: #555; background: #fff7e0; border: 1px solid #f1dc9a; border-radius: 8px; padding: 6px 10px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e3e5e8; }
  input { flex: 1; padding: 10px 12px; border: 1px solid #cfd3d8; border-radius: 10px; font-size: 15px; }
  button { padding: 10px 18px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { background: #9db7ee; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>University Course Advisor <span id="status">connecting...</span></header>
  <div id="chat">
    <div class="msg bot">Hi! Ask me about course prerequisites, credit hours, admissions or deadlines.</div>
  </div>
  <form id="form">
    <input id="input" placeholder="Type your question..." autocomplete="off">
    <button id="send">Send</button>
  </form>
</div>
<script>
const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + (location.host || "127.0.0.1:8000") + "/ws/chat";
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const statusEl = document.getElementById("status");
let ws, botBubble = null, botText = "";

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function addMsg(cls, text) {
  const d = document.createElement("div");
  d.className = cls === "tool" ? "tool" : "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function setBusy(busy) {
  send.disabled = busy;
  input.disabled = busy;
  if (!busy) input.focus();
}
function describeResult(m) {
  const r = m.result;
  if (m.name === "search_faq" && r.found) {
    return "Result: " + r.results.length + " FAQ entries, best match \"" + r.results[0].question + "\"";
  }
  return "Result: " + JSON.stringify(r);
}

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { statusEl.textContent = "connected"; };
  ws.onclose = () => { statusEl.textContent = "disconnected"; setBusy(false); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "tool_call") {
      addMsg("tool", "Calling tool: " + m.name + "(" + JSON.stringify(m.args) + ")");
    } else if (m.type === "tool_result") {
      addMsg("tool", describeResult(m));
    } else if (m.type === "chunk") {
      if (!botBubble) { botBubble = addMsg("bot", ""); botText = ""; }
      botText += m.text;
      botBubble.innerHTML = esc(botText).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      chat.scrollTop = chat.scrollHeight;
    } else if (m.type === "done") {
      botBubble = null; setBusy(false);
    } else if (m.type === "error") {
      botBubble = null; addMsg("bot", "Sorry, something went wrong: " + m.text); setBusy(false);
    }
  };
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  addMsg("user", text);
  ws.send(text);
  input.value = "";
  setBusy(true);
});

connect();
</script>
</body>
</html>
